<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>点阵围格 - 双人对战</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #F7F3EE;
      --card: #FFFFFF;
      --dot: #3D3D3D;
      --line-hint: #E0DCD7;
      --text: #2C2C2C;
      --text-muted: #8A8580;
      --shadow: 0 4px 24px rgba(0,0,0,0.08);
      --shadow-lg: 0 8px 40px rgba(0,0,0,0.12);
      --radius: 12px;
      --radius-sm: 8px;
      --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    }

    /* ========== Setup Screen ========== */
    #setup-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      width: 100%;
      max-width: 520px;
    }

    .setup-title {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 3px;
      color: var(--text);
      margin-bottom: 4px;
    }

    .setup-subtitle {
      font-size: 15px;
      color: var(--text-muted);
      margin-bottom: 36px;
    }

    .player-setup-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 24px;
      width: 100%;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }

    .player-setup-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .player-setup-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid var(--line-hint);
      transition: all 0.3s ease;
    }

    .player-setup-dot.selected {
      border-color: transparent;
      box-shadow: 0 0 0 2px currentColor;
    }

    .player-setup-name {
      font-size: 17px;
      font-weight: 600;
    }

    .color-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
    }

    .color-option {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 50%;
      cursor: pointer;
      border: 3px solid transparent;
      transition: all 0.2s ease;
      position: relative;
    }

    .color-option:hover {
      transform: scale(1.15);
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
    }

    .color-option.selected {
      border-color: var(--dot);
      transform: scale(1.1);
      box-shadow: 0 2px 12px rgba(0,0,0,0.2);
    }

    .color-option.selected::after {
      content: '\2713';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 14px;
      font-weight: 700;
      text-shadow: 0 1px 2px rgba(0,0,0,0.3);
    }

    .color-option.disabled {
      opacity: 0.25;
      cursor: not-allowed;
      pointer-events: none;
    }

    .start-btn {
      margin-top: 8px;
      padding: 14px 48px;
      font-size: 17px;
      font-weight: 600;
      font-family: var(--font);
      border: none;
      border-radius: var(--radius-sm);
      background: var(--dot);
      color: white;
      cursor: pointer;
      transition: all 0.2s ease;
      letter-spacing: 1px;
    }

    .start-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    }

    .start-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    /* ========== Game Screen ========== */
    #game-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      min-height: 100vh;
      padding: 16px;
    }

    .game-top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 560px;
      margin-bottom: 12px;
      gap: 8px;
    }

    .player-panel {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--card);
      border-radius: var(--radius-sm);
      padding: 10px 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      flex: 1;
      min-width: 0;
      transition: all 0.35s ease;
      border: 2.5px solid transparent;
    }

    .player-panel.active {
      box-shadow: 0 2px 16px rgba(0,0,0,0.1);
    }

    .player-panel.p1 { flex-direction: row; }
    .player-panel.p2 { flex-direction: row-reverse; text-align: right; }

    .player-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
      position: relative;
    }

    .player-avatar .inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
    }

    .player-panel.active .player-avatar::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 2px solid var(--active-color);
      animation: pulse-ring 1.5s ease-in-out infinite;
    }

    @keyframes pulse-ring {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.15); opacity: 0.5; }
    }

    .player-detail {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .player-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-score {
      font-size: 26px;
      font-weight: 700;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }

    .turn-indicator {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
      padding: 0 4px;
    }

    .turn-text {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
      font-weight: 500;
      transition: color 0.3s ease;
    }

    .turn-arrow {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      transition: all 0.3s ease;
    }

    /* ========== Board ========== */
    .board-container {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      padding: 20px;
      position: relative;
      touch-action: none;
    }

    #board { display: block; cursor: pointer; }

    .game-bottom-bar {
      margin-top: 16px;
      display: flex;
      gap: 12px;
    }

    .action-btn {
      padding: 10px 24px;
      font-size: 14px;
      font-weight: 500;
      font-family: var(--font);
      border: 2px solid var(--line-hint);
      border-radius: var(--radius-sm);
      background: var(--card);
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .action-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      border-color: var(--dot);
    }

    /* ========== Game Over Modal ========== */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(4px);
      z-index: 100;
      justify-content: center;
      align-items: center;
      animation: fadeIn 0.3s ease;
    }

    .modal-overlay.show { display: flex; }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-card {
      background: var(--card);
      border-radius: 16px;
      padding: 36px 40px;
      text-align: center;
      box-shadow: var(--shadow-lg);
      animation: slideUp 0.3s ease;
      max-width: 360px;
      width: 90%;
    }

    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .modal-icon { font-size: 48px; margin-bottom: 12px; }
    .modal-title { font-size: 22px; font-weight: 700; margin-bottom: 8px; }

    .modal-scores {
      display: flex;
      justify-content: center;
      gap: 32px;
      margin: 20px 0;
    }

    .modal-score-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .modal-score-dot { width: 24px; height: 24px; border-radius: 50%; }
    .modal-score-name { font-size: 13px; color: var(--text-muted); }
    .modal-score-value { font-size: 32px; font-weight: 700; font-variant-numeric: tabular-nums; }

    .modal-btn {
      margin-top: 8px;
      padding: 12px 36px;
      font-size: 16px;
      font-weight: 600;
      font-family: var(--font);
      border: none;
      border-radius: var(--radius-sm);
      background: var(--dot);
      color: white;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .modal-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    }

    /* ========== Tip Toast ========== */
    .tip-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--dot);
      color: white;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 50;
      pointer-events: none;
    }

    .tip-toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* ========== Responsive ========== */
    @media (max-width: 480px) {
      .setup-title { font-size: 26px; }
      .player-setup-card { padding: 18px; }
      .color-grid { gap: 8px; }
      .game-top-bar { gap: 4px; }
      .player-panel { padding: 8px 10px; gap: 6px; }
      .player-score { font-size: 22px; }
      .board-container { padding: 14px; }
      .turn-text { font-size: 11px; }
      .modal-card { padding: 28px 24px; }
    }
  </style>
</head>
<body>

  <!-- ========== Setup Screen ========== -->
  <div id="setup-screen">
    <div class="setup-title">点阵围格</div>
    <div class="setup-subtitle">双人对战 · 选色开局</div>

    <div class="player-setup-card" id="p1-setup">
      <div class="player-setup-header">
        <div class="player-setup-dot" id="p1-dot"></div>
        <div class="player-setup-name">玩家一</div>
      </div>
      <div class="color-grid" id="p1-colors"></div>
    </div>

    <div class="player-setup-card" id="p2-setup">
      <div class="player-setup-header">
        <div class="player-setup-dot" id="p2-dot"></div>
        <div class="player-setup-name">玩家二</div>
      </div>
      <div class="color-grid" id="p2-colors"></div>
    </div>

    <button class="start-btn" id="start-btn" disabled>选择颜色后开始</button>
  </div>

  <!-- ========== Game Screen ========== -->
  <div id="game-screen">
    <div class="game-top-bar">
      <div class="player-panel p1" id="p1-panel">
        <div class="player-avatar"><div class="inner" id="p1-avatar"></div></div>
        <div class="player-detail">
          <div class="player-name">玩家一</div>
          <div class="player-score" id="p1-score">0</div>
        </div>
      </div>
      <div class="turn-indicator">
        <div class="turn-text" id="turn-text">玩家一 回合</div>
        <div class="turn-arrow" id="turn-arrow"></div>
      </div>
      <div class="player-panel p2" id="p2-panel">
        <div class="player-avatar"><div class="inner" id="p2-avatar"></div></div>
        <div class="player-detail">
          <div class="player-name">玩家二</div>
          <div class="player-score" id="p2-score">0</div>
        </div>
      </div>
    </div>
    <div class="board-container">
      <canvas id="board"></canvas>
    </div>
    <div class="game-bottom-bar">
      <button class="action-btn" id="restart-btn">重新开始</button>
      <button class="action-btn" id="back-btn">返回选色</button>
    </div>
  </div>

  <!-- ========== Game Over Modal ========== -->
  <div class="modal-overlay" id="gameover-modal">
    <div class="modal-card">
      <div class="modal-icon" id="modal-icon"></div>
      <div class="modal-title" id="modal-title">游戏结束</div>
      <div class="modal-scores">
        <div class="modal-score-item">
          <div class="modal-score-dot" id="modal-p1-dot"></div>
          <div class="modal-score-name">玩家一</div>
          <div class="modal-score-value" id="modal-p1-score">0</div>
        </div>
        <div class="modal-score-item">
          <div class="modal-score-dot" id="modal-p2-dot"></div>
          <div class="modal-score-name">玩家二</div>
          <div class="modal-score-value" id="modal-p2-score">0</div>
        </div>
      </div>
      <button class="modal-btn" id="play-again-btn">再来一局</button>
    </div>
  </div>

  <!-- ========== Tip Toast ========== -->
  <div class="tip-toast" id="tip-toast"></div>

  <script>
    /* ================================================================
       CONSTANTS & COLOR PALETTE
       ================================================================ */
    var COLORS = [
      { name: '珊瑚红', hex: '#FF6B6B' },
      { name: '暖橙',   hex: '#FF9F43' },
      { name: '金黄',   hex: '#FECA57' },
      { name: '青柠',   hex: '#8BC34A' },
      { name: '翡翠绿', hex: '#2ECC71' },
      { name: '薄荷',   hex: '#00B894' },
      { name: '天蓝',   hex: '#54A0FF' },
      { name: '靛蓝',   hex: '#5F27CD' },
      { name: '紫罗兰', hex: '#9B59B6' },
      { name: '玫粉',   hex: '#E91E63' },
      { name: '棕褐',   hex: '#CD853F' },
      { name: '石板灰', hex: '#576574' }
    ];

    var GRID = 5;
    var BOXES = GRID - 1;
    var DOT_R = 5;
    var LINE_HIT = 14;

    /* ================================================================
       GAME STATE
       ================================================================ */
    var p1Color = null, p2Color = null;
    var currentPlayer = 1;
    var scores = [0, 0];
    var hLines = [];   // hLines[row][col]  horizontal, row 0..4, col 0..3
    var vLines = [];   // vLines[row][col]  vertical,   row 0..3, col 0..4
    var boxOwner = []; // boxOwner[row][col] 0=none, 1=p1, 2=p2
    var totalBoxes = BOXES * BOXES;
    var hoveredLine = null;
    var gameOver = false;

    // Canvas
    var canvas, ctx;
    var cellSize, pad, boardPx;

    // Animation
    var lastPlacedLine = null;
    var lastPlacedTime = 0;
    var PLACE_ANIM_MS = 200;

    /* ================================================================
       POLYFILL: roundRect
       ================================================================ */
    if (!CanvasRenderingContext2D.prototype.roundRect) {
      CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
        if (typeof r === 'number') r = [r, r, r, r];
        this.moveTo(x + r[0], y);
        this.lineTo(x + w - r[1], y);
        this.arcTo(x + w, y, x + w, y + r[1], r[1]);
        this.lineTo(x + w, y + h - r[2]);
        this.arcTo(x + w, y + h, x + w - r[2], y + h, r[2]);
        this.lineTo(x + r[3], y + h);
        this.arcTo(x, y + h, x, y + h - r[3], r[3]);
        this.lineTo(x, y + r[0]);
        this.arcTo(x, y, x + r[0], y, r[0]);
        this.closePath();
        return this;
      };
    }

    /* ================================================================
       SETUP SCREEN
       ================================================================ */
    function initSetup() {
      var p1Grid = document.getElementById('p1-colors');
      var p2Grid = document.getElementById('p2-colors');
      p1Grid.innerHTML = '';
      p2Grid.innerHTML = '';

      COLORS.forEach(function (c, i) {
        p1Grid.appendChild(makeColorBtn(c, i, 1));
        p2Grid.appendChild(makeColorBtn(c, i, 2));
      });

      updateColorUI();
      updateStartBtn();
    }

    function makeColorBtn(color, index, player) {
      var btn = document.createElement('div');
      btn.className = 'color-option';
      btn.style.background = color.hex;
      btn.title = color.name;
      btn.addEventListener('click', function () {
        if (player === 1) p1Color = index;
        else p2Color = index;
        updateColorUI();
        updateStartBtn();
      });
      return btn;
    }

    function updateColorUI() {
      var p1Btns = document.querySelectorAll('#p1-colors .color-option');
      var p2Btns = document.querySelectorAll('#p2-colors .color-option');
      p1Btns.forEach(function (b, i) {
        b.classList.toggle('selected', i === p1Color);
        b.classList.toggle('disabled', i === p2Color && i !== p1Color);
      });
      p2Btns.forEach(function (b, i) {
        b.classList.toggle('selected', i === p2Color);
        b.classList.toggle('disabled', i === p1Color && i !== p2Color);
      });

      var p1Dot = document.getElementById('p1-dot');
      var p2Dot = document.getElementById('p2-dot');
      if (p1Color !== null) {
        p1Dot.style.background = COLORS[p1Color].hex;
        p1Dot.classList.add('selected');
        p1Dot.style.color = COLORS[p1Color].hex;
      } else {
        p1Dot.style.background = 'transparent';
        p1Dot.classList.remove('selected');
      }
      if (p2Color !== null) {
        p2Dot.style.background = COLORS[p2Color].hex;
        p2Dot.classList.add('selected');
        p2Dot.style.color = COLORS[p2Color].hex;
      } else {
        p2Dot.style.background = 'transparent';
        p2Dot.classList.remove('selected');
      }
    }

    function updateStartBtn() {
      var btn = document.getElementById('start-btn');
      var ready = p1Color !== null && p2Color !== null;
      btn.disabled = !ready;
      btn.textContent = ready ? '开始游戏' : '选择颜色后开始';
    }

    /* ================================================================
       GAME INIT
       ================================================================ */
    function initGame() {
      currentPlayer = 1;
      scores = [0, 0];
      gameOver = false;
      hLines = [];
      for (var r = 0; r < GRID; r++) { hLines[r] = []; for (var c = 0; c < GRID - 1; c++) hLines[r][c] = 0; }
      vLines = [];
      for (var r = 0; r < GRID - 1; r++) { vLines[r] = []; for (var c = 0; c < GRID; c++) vLines[r][c] = 0; }
      boxOwner = [];
      for (var r = 0; r < BOXES; r++) { boxOwner[r] = []; for (var c = 0; c < BOXES; c++) boxOwner[r][c] = 0; }
      hoveredLine = null;
      lastPlacedLine = null;

      canvas = document.getElementById('board');
      ctx = canvas.getContext('2d');
      resizeCanvas();

      var hex1 = COLORS[p1Color].hex;
      var hex2 = COLORS[p2Color].hex;
      document.getElementById('p1-avatar').style.background = hex1;
      document.getElementById('p2-avatar').style.background = hex2;
      document.getElementById('p1-score').textContent = '0';
      document.getElementById('p2-score').textContent = '0';
      document.getElementById('p1-score').style.color = hex1;
      document.getElementById('p2-score').style.color = hex2;

      updateTurnUI();
      drawBoard();
    }

    function resizeCanvas() {
      var maxW = Math.min(window.innerWidth - 72, 480);
      var maxH = window.innerHeight - 240;
      var size = Math.max(260, Math.min(maxW, maxH, 480));
      var dpr = window.devicePixelRatio || 1;

      boardPx = size;
      pad = Math.max(20, size * 0.06);
      cellSize = (size - 2 * pad) / (GRID - 1);

      canvas.width = size * dpr;
      canvas.height = size * dpr;
      canvas.style.width = size + 'px';
      canvas.style.height = size + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    /* ================================================================
       DRAWING
       ================================================================ */
    function dotXY(row, col) {
      return { x: pad + col * cellSize, y: pad + row * cellSize };
    }

    function drawBoard() {
      ctx.clearRect(0, 0, boardPx, boardPx);
      drawBoxFills();
      drawHintLines();
      drawPlacedLines();
      drawHoverLine();
      drawDots();
    }

    function drawDots() {
      for (var r = 0; r < GRID; r++) {
        for (var c = 0; c < GRID; c++) {
          var p = dotXY(r, c);
          ctx.beginPath();
          ctx.arc(p.x, p.y, DOT_R, 0, Math.PI * 2);
          ctx.fillStyle = '#3D3D3D';
          ctx.fill();
        }
      }
    }

    function drawHintLines() {
      ctx.save();
      ctx.setLineDash([4, 6]);
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = '#E0DCD7';
      ctx.lineCap = 'round';

      for (var r = 0; r < GRID; r++) {
        for (var c = 0; c < GRID - 1; c++) {
          if (hLines[r][c] === 0) {
            var a = dotXY(r, c), b = dotXY(r, c + 1);
            ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
          }
        }
      }
      for (var r = 0; r < GRID - 1; r++) {
        for (var c = 0; c < GRID; c++) {
          if (vLines[r][c] === 0) {
            var a = dotXY(r, c), b = dotXY(r + 1, c);
            ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
          }
        }
      }
      ctx.restore();
    }

    function drawPlacedLines() {
      ctx.save();
      ctx.lineWidth = 3.5;
      ctx.lineCap = 'round';
      ctx.setLineDash([]);

      for (var r = 0; r < GRID; r++) {
        for (var c = 0; c < GRID - 1; c++) {
          if (hLines[r][c] !== 0) {
            var a = dotXY(r, c), b = dotXY(r, c + 1);
            ctx.strokeStyle = playerHex(hLines[r][c]);
            ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
          }
        }
      }
      for (var r = 0; r < GRID - 1; r++) {
        for (var c = 0; c < GRID; c++) {
          if (vLines[r][c] !== 0) {
            var a = dotXY(r, c), b = dotXY(r + 1, c);
            ctx.strokeStyle = playerHex(vLines[r][c]);
            ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
          }
        }
      }
      ctx.restore();
    }

    function drawHoverLine() {
      if (!hoveredLine || gameOver) return;
      var type = hoveredLine.type, row = hoveredLine.row, col = hoveredLine.col;
      var a, b;
      if (type === 'h') { a = dotXY(row, col); b = dotXY(row, col + 1); }
      else              { a = dotXY(row, col); b = dotXY(row + 1, col); }

      ctx.save();
      ctx.lineWidth = 4.5;
      ctx.lineCap = 'round';
      ctx.setLineDash([]);
      ctx.globalAlpha = 0.4;
      ctx.strokeStyle = playerHex(currentPlayer);
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      ctx.restore();
    }

    function drawBoxFills() {
      for (var r = 0; r < BOXES; r++) {
        for (var c = 0; c < BOXES; c++) {
          if (boxOwner[r][c] !== 0) {
            var owner = boxOwner[r][c];
            var color = playerHex(owner);
            var tl = dotXY(r, c);
            var br = dotXY(r + 1, c + 1);
            var inset = 3;

            ctx.save();
            ctx.fillStyle = color;
            ctx.globalAlpha = 0.18;
            ctx.beginPath();
            ctx.roundRect(tl.x + inset, tl.y + inset, br.x - tl.x - 2 * inset, br.y - tl.y - 2 * inset, 4);
            ctx.fill();

            // Owner mark
            var cx = (tl.x + br.x) / 2;
            var cy = (tl.y + br.y) / 2;
            ctx.globalAlpha = 0.55;
            ctx.fillStyle = color;
            ctx.font = '600 ' + Math.max(14, Math.round(cellSize * 0.18)) + 'px ' + getComputedStyle(document.body).fontFamily;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(owner === 1 ? '一' : '二', cx, cy);
            ctx.restore();
          }
        }
      }
    }

    function playerHex(p) {
      return p === 1 ? COLORS[p1Color].hex : COLORS[p2Color].hex;
    }

    /* ================================================================
       LINE HIT DETECTION
       ================================================================ */
    function findHoveredLine(mx, my) {
      var best = null, bestDist = LINE_HIT;

      for (var r = 0; r < GRID; r++) {
        for (var c = 0; c < GRID - 1; c++) {
          if (hLines[r][c] !== 0) continue;
          var a = dotXY(r, c), b = dotXY(r, c + 1);
          var d = distToSeg(mx, my, a.x, a.y, b.x, b.y);
          if (d < bestDist) { bestDist = d; best = { type: 'h', row: r, col: c }; }
        }
      }
      for (var r = 0; r < GRID - 1; r++) {
        for (var c = 0; c < GRID; c++) {
          if (vLines[r][c] !== 0) continue;
          var a = dotXY(r, c), b = dotXY(r + 1, c);
          var d = distToSeg(mx, my, a.x, a.y, b.x, b.y);
          if (d < bestDist) { bestDist = d; best = { type: 'v', row: r, col: c }; }
        }
      }
      return best;
    }

    function distToSeg(px, py, x1, y1, x2, y2) {
      var dx = x2 - x1, dy = y2 - y1;
      var lenSq = dx * dx + dy * dy;
      if (lenSq === 0) return Math.hypot(px - x1, py - y1);
      var t = Math.max(0, Math.min(1, ((px - x1) * dx + (py - y1) * dy) / lenSq));
      return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
    }

    /* ================================================================
       GAME LOGIC
       ================================================================ */
    function placeLine(line) {
      if (gameOver) return;

      var type = line.type, row = line.row, col = line.col;

      // Place the line
      if (type === 'h') hLines[row][col] = currentPlayer;
      else              vLines[row][col] = currentPlayer;

      // Check completed boxes
      var completed = checkBoxes(line);

      if (completed > 0) {
        // Extra turn – player continues
        showToast((currentPlayer === 1 ? '玩家一' : '玩家二') + '占领了 ' + completed + ' 格，继续行动！');
      } else {
        // Switch turn
        currentPlayer = currentPlayer === 1 ? 2 : 1;
      }

      updateTurnUI();
      drawBoard();

      // Game over?
      if (scores[0] + scores[1] === totalBoxes) {
        gameOver = true;
        setTimeout(showGameOver, 500);
      }
    }

    function checkBoxes(line) {
      var type = line.type, row = line.row, col = line.col;
      var completed = 0;

      if (type === 'h') {
        // Horizontal line at (row, col) is the top of box (row, col) or bottom of box (row-1, col)
        if (row < BOXES && boxOwner[row][col] === 0 && isBoxComplete(row, col)) {
          boxOwner[row][col] = currentPlayer;
          scores[currentPlayer - 1]++;
          completed++;
        }
        if (row > 0 && boxOwner[row - 1][col] === 0 && isBoxComplete(row - 1, col)) {
          boxOwner[row - 1][col] = currentPlayer;
          scores[currentPlayer - 1]++;
          completed++;
        }
      } else {
        // Vertical line at (row, col) is the left of box (row, col) or right of box (row, col-1)
        if (col < BOXES && boxOwner[row][col] === 0 && isBoxComplete(row, col)) {
          boxOwner[row][col] = currentPlayer;
          scores[currentPlayer - 1]++;
          completed++;
        }
        if (col > 0 && boxOwner[row][col - 1] === 0 && isBoxComplete(row, col - 1)) {
          boxOwner[row][col - 1] = currentPlayer;
          scores[currentPlayer - 1]++;
          completed++;
        }
      }

      document.getElementById('p1-score').textContent = scores[0];
      document.getElementById('p2-score').textContent = scores[1];
      return completed;
    }

    function isBoxComplete(r, c) {
      return hLines[r][c] !== 0 && hLines[r + 1][c] !== 0 &&
             vLines[r][c] !== 0 && vLines[r][c + 1] !== 0;
    }

    /* ================================================================
       UI UPDATES
       ================================================================ */
    function updateTurnUI() {
      var color = playerHex(currentPlayer);
      var name = currentPlayer === 1 ? '玩家一' : '玩家二';
      document.getElementById('turn-text').textContent = name + ' 回合';
      document.getElementById('turn-text').style.color = color;
      document.getElementById('turn-arrow').style.background = color;

      var p1 = document.getElementById('p1-panel');
      var p2 = document.getElementById('p2-panel');

      if (currentPlayer === 1) {
        p1.classList.add('active');
        p1.style.setProperty('--active-color', COLORS[p1Color].hex);
        p1.style.borderColor = COLORS[p1Color].hex;
        p2.classList.remove('active');
        p2.style.borderColor = 'transparent';
      } else {
        p2.classList.add('active');
        p2.style.setProperty('--active-color', COLORS[p2Color].hex);
        p2.style.borderColor = COLORS[p2Color].hex;
        p1.classList.remove('active');
        p1.style.borderColor = 'transparent';
      }
    }

    function showGameOver() {
      var hex1 = COLORS[p1Color].hex, hex2 = COLORS[p2Color].hex;
      document.getElementById('modal-p1-dot').style.background = hex1;
      document.getElementById('modal-p2-dot').style.background = hex2;
      document.getElementById('modal-p1-score').textContent = scores[0];
      document.getElementById('modal-p1-score').style.color = hex1;
      document.getElementById('modal-p2-score').textContent = scores[1];
      document.getElementById('modal-p2-score').style.color = hex2;

      var icon = document.getElementById('modal-icon');
      var title = document.getElementById('modal-title');

      if (scores[0] > scores[1]) {
        icon.textContent = '\uD83C\uDFC6';
        title.textContent = '玩家一 获胜！';
        title.style.color = hex1;
      } else if (scores[1] > scores[0]) {
        icon.textContent = '\uD83C\uDFC6';
        title.textContent = '玩家二 获胜！';
        title.style.color = hex2;
      } else {
        icon.textContent = '\uD83E\uDD1D';
        title.textContent = '势均力敌，平局！';
        title.style.color = '#2C2C2C';
      }

      document.getElementById('gameover-modal').classList.add('show');
    }

    /* ================================================================
       TOAST
       ================================================================ */
    var toastTimer = null;
    function showToast(msg) {
      var el = document.getElementById('tip-toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { el.classList.remove('show'); }, 1800);
    }

    /* ================================================================
       EVENT HANDLERS
       ================================================================ */
    function canvasPos(e) {
      var rect = canvas.getBoundingClientRect();
      var sx = boardPx / rect.width;
      var sy = boardPx / rect.height;
      var cx, cy;
      if (e.touches && e.touches.length > 0) {
        cx = e.touches[0].clientX;
        cy = e.touches[0].clientY;
      } else if (e.changedTouches && e.changedTouches.length > 0) {
        cx = e.changedTouches[0].clientX;
        cy = e.changedTouches[0].clientY;
      } else {
        cx = e.clientX;
        cy = e.clientY;
      }
      return { x: (cx - rect.left) * sx, y: (cy - rect.top) * sy };
    }

    function onMove(e) {
      if (gameOver) return;
      e.preventDefault();
      var pos = canvasPos(e);
      var prev = hoveredLine;
      hoveredLine = findHoveredLine(pos.x, pos.y);
      if (JSON.stringify(prev) !== JSON.stringify(hoveredLine)) drawBoard();
      canvas.style.cursor = hoveredLine ? 'pointer' : 'default';
    }

    function onClick(e) {
      if (gameOver) return;
      e.preventDefault();
      if (hoveredLine) {
        placeLine(hoveredLine);
        hoveredLine = null;
        drawBoard();
      }
    }

    function onLeave() {
      hoveredLine = null;
      drawBoard();
      canvas.style.cursor = 'default';
    }

    /* ================================================================
       SCREEN NAV
       ================================================================ */
    function showScreen(id) {
      document.getElementById('setup-screen').style.display = 'none';
      document.getElementById('game-screen').style.display = 'none';
      document.getElementById('gameover-modal').classList.remove('show');

      if (id === 'setup') document.getElementById('setup-screen').style.display = 'flex';
      else if (id === 'game') document.getElementById('game-screen').style.display = 'flex';
    }

    /* ================================================================
       MAIN
       ================================================================ */
    function main() {
      initSetup();

      document.getElementById('start-btn').addEventListener('click', function () {
        if (p1Color !== null && p2Color !== null) {
          showScreen('game');
          initGame();
          bindCanvas();
        }
      });

      document.getElementById('restart-btn').addEventListener('click', function () {
        document.getElementById('gameover-modal').classList.remove('show');
        initGame();
      });

      document.getElementById('back-btn').addEventListener('click', function () {
        showScreen('setup');
        p1Color = null;
        p2Color = null;
        updateColorUI();
        updateStartBtn();
      });

      document.getElementById('play-again-btn').addEventListener('click', function () {
        document.getElementById('gameover-modal').classList.remove('show');
        initGame();
      });

      window.addEventListener('resize', function () {
        if (document.getElementById('game-screen').style.display !== 'none' && canvas) {
          resizeCanvas();
          drawBoard();
        }
      });
    }

    var canvasBound = false;
    function bindCanvas() {
      if (canvasBound) return;
      canvasBound = true;

      canvas.addEventListener('mousemove', onMove);
      canvas.addEventListener('click', onClick);
      canvas.addEventListener('mouseleave', onLeave);

      // Touch: touchstart to detect, touchmove to update hover, touchend to place
      canvas.addEventListener('touchstart', function (e) {
        if (gameOver) return;
        e.preventDefault();
        var pos = canvasPos(e);
        hoveredLine = findHoveredLine(pos.x, pos.y);
        drawBoard();
      }, { passive: false });

      canvas.addEventListener('touchmove', function (e) {
        onMove(e);
      }, { passive: false });

      canvas.addEventListener('touchend', function (e) {
        if (gameOver) return;
        e.preventDefault();
        if (hoveredLine) {
          placeLine(hoveredLine);
          hoveredLine = null;
          drawBoard();
        }
      }, { passive: false });
    }

    main();
  </script>
</body>
</html>
